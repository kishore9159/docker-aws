<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Docker Deployment App</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--success);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .stats-box {
      background-color: var(--bg-color);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
      font-size: 0.875rem;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px solid #1e293b;
    }

    .stats-row:last-child {
      border-bottom: none;
    }

    .stats-label {
      color: var(--text-muted);
    }

    .stats-value {
      font-family: monospace;
      color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">
      <span class="dot"></span>
      Container Active
    </div>
    <h1>Deployed on AWS</h1>
    <p>This HTML, CSS, and JavaScript application is running inside a lightweight Nginx Docker container.</p>

    <div class="stats-box">
      <div class="stats-row">
        <span class="stats-label">Host / IP:</span>
        <span class="stats-value" id="host-info">Loading...</span>
      </div>
      <div class="stats-row">
        <span class="stats-label">Client Time:</span>
        <span class="stats-value" id="clock">--:--:--</span>
      </div>
      <div class="stats-row">
        <span class="stats-label">Button Clicks:</span>
        <span class="stats-value" id="click-count">0</span>
      </div>
    </div>

    <button id="test-btn">Test Interactive State</button>
  </div>

  <script>
    // Display current hostname/IP from browser URL
    document.getElementById("host-info").textContent = window.location.host || "localhost";

    // Live clock update
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Interactive counter state
    let count = 0;
    const btn = document.getElementById("test-btn");
    const counterDisplay = document.getElementById("click-count");

    btn.addEventListener("click", () => {
      count += 1;
      counterDisplay.textContent = count;
    });
  </script>
</body>
</html>
